# Serves the Angular app and proxies the API on the same origin (plan 014): the app calls relative /api/v1/... URLs, so no
# CORS is needed and the refresh cookie (Path=/api/v1/auth, Secure, SameSite=Strict) works on http://localhost.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles never change; index.html must always be fresh so a rebuild is picked up.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (e.g. /login, /schedule) fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
